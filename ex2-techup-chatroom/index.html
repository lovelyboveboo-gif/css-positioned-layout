  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>

<body>
    <div class="chatroom">
      <h1 class="header">Techup Chatroom</h1>
  
      <div class="messages">
        <div class="msg me green">สวัสดีจ้า</div>
        <div class="msg me light">
          Coding สนุกจังเลย
          <span class="close"><i class="fa-solid fa-xmark"></i></span>
        </div>
        <div class="msg me green">🐥 🤩</div>
  
        <div class="msg other">😍</div>
        <div class="msg other">🐥</div>
      </div>
    </div>
</body>
